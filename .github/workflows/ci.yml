name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'uv'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install -e ./gen-fraud-graph
          uv pip install -e ".[dev]"

      - name: Run linting (ruff)
        run: uv run ruff check src/ main.py scripts/

      - name: Run type checking (mypy)
        run: uv run mypy src/ main.py --ignore-missing-imports

      - name: Run quick tests
        run: |
          uv run python -c "import src.features; import src.models; import src.evaluation; print('Imports OK')"
          uv run python main.py --help