[project]
name = "tg-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.48.0",
    "xgboost>=3.4.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "gen-fraud-graph",
]

[tool.uv]
# numba<0.65 has no cp313 wheel and fails to build from source on Python 3.13.
# Pin to >=0.65 to force a wheel that ships with cp313 support.
override-dependencies = [
    "numba>=0.65.0",
    "llvmlite>=0.42.0",
]

[tool.uv.sources]
gen-fraud-graph = { path = "./gen-fraud-graph", editable = true }

